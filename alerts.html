<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alerts | Price Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('style_css') }}">
</head>
<body>
  <main class="alerts-page">
    <header class="detail-topbar"><a class="back-link" href="/">← Back to dashboard</a><div class="avatar">NA</div></header>
    <div class="eyebrow">Notifications</div>
    <h1>Alert preferences</h1>
    <p class="alerts-intro">Products configured for price notifications. Delivery will be enabled later.</p>
    <section class="alerts-panel">
      <div class="alerts-panel-head"><div><div class="eyebrow">Your alerts</div><h2>Tracked price alerts</h2></div><span class="alerts-count" id="alerts-count">—</span></div>
      <div id="alerts-list" class="alerts-list"><div class="detail-state">Loading alerts...</div></div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='alerts.js') }}"></script>
</body>
</html>
