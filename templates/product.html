<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f2">
  <title>Product history | Price Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('style_css') }}">
</head>
<body>
  <main class="detail-page" data-asin="{{ asin }}">
    <header class="detail-topbar"><a class="back-link" href="/">← Back to watchlist</a><div class="avatar">NA</div></header>
    <div id="detail-loading" class="detail-state">Loading product history...</div>
    <section id="detail-content" hidden>
      <div class="eyebrow">Product detail · <span id="detail-asin">{{ asin }}</span></div>
      <h1><a id="detail-name" href="https://www.amazon.com/" target="_blank" rel="noopener noreferrer">Product history</a></h1>
      <div class="detail-grid">
        <section class="detail-panel chart-panel"><div class="detail-panel-head"><div><div class="eyebrow">Price history</div><div class="period-picker"><button class="period-trigger" id="period-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">Last 30 days <span>⌄</span></button><div class="period-menu" id="period-menu" role="listbox" hidden><button type="button" data-period="30d" role="option">Last 30 days</button><button type="button" data-period="3m" role="option">Last 3 months</button><button type="button" data-period="6m" role="option">Last 6 months</button><button type="button" data-period="1y" role="option">Last year</button><button type="button" data-period="all" role="option">All time</button></div></div></div><div class="current-price" id="detail-current-price">—</div></div><div class="chart-wrap"><svg id="price-chart" viewBox="0 0 800 300" role="img" aria-label="Product price history chart"></svg></div></section>
        <section class="detail-panel snapshot-panel"><div class="eyebrow">Snapshot</div><h2>Price signals</h2><div class="detail-stats"><div><span>Lowest recorded</span><strong id="detail-min">—</strong></div><div><span>Highest recorded</span><strong id="detail-max">—</strong></div></div><div class="editable-settings"><label for="detail-target">Target price</label><input id="detail-target" type="number" min="0" step="1" placeholder="Optional"><label for="detail-email">Email</label><input id="detail-email" type="email" placeholder="you@example.com"><label for="detail-phone">Phone number</label><input id="detail-phone" type="tel" placeholder="(555) 555-5555"><button class="primary settings-save" id="settings-save" type="button">Update alert preferences</button><p class="settings-status" id="settings-status" role="status"></p></div></section>
      </div>
    </section>
    <div id="detail-error" class="detail-state error" hidden></div>
  </main>
  <script src="{{ url_for('static', filename='product.js') }}"></script>
</body>
</html>
